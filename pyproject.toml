[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "elythera-experttrace"
version = "0.1.1"
description = "Open-source toolkit for eliciting, structuring, and auditing expert knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Elythera Labs" }]
keywords = ["knowledge-management", "tacit-knowledge", "responsible-ai", "ai-governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
experttrace = "experttrace.cli:main"

[project.optional-dependencies]
llm = ["litellm>=1.70"]

[tool.hatch.build.targets.wheel]
packages = ["src/experttrace"]

[tool.hatch.build.targets.sdist]
include = ["src/experttrace", "tests", "examples", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md"]

[tool.hatch.build]
include = ["src/experttrace/**/*.py", "src/experttrace/packs/*.json"]

[project.urls]
Homepage = "https://github.com/elythera-lab/experttrace"
Repository = "https://github.com/elythera-lab/experttrace"
Issues = "https://github.com/elythera-lab/experttrace/issues"
